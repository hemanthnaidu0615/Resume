<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Resume - Modern Bold</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        @media print {
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            .no-print {
                display: none;
            }
        }

        .gradient-header {
            background: linear-gradient(135deg, #06B6D4 0%, #2563EB 100%);
        }

        .accent-bar {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #06B6D4, #2563EB);
            margin-bottom: 1rem;
        }

        .skill-pill {
            background: linear-gradient(135deg, #06B6D4, #2563EB);
            transition: transform 0.2s;
        }

        .skill-pill:hover {
            transform: translateY(-2px);
        }

        .experience-card {
            border-left: 4px solid #06B6D4;
            transition: border-color 0.3s;
        }

        .experience-card:hover {
            border-left-color: #2563EB;
        }

        .section-number {
            font-size: 80px;
            font-weight: 800;
            color: #06B6D4;
            opacity: 0.1;
            position: absolute;
            top: -20px;
            left: 0;
            line-height: 1;
        }

        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-50">

    <div id="loading" class="text-center">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-600"></div>
        <p class="mt-4 text-gray-600">Loading resume...</p>
    </div>

    <div id="resume-content" style="display: none;">
        <!-- Content will be generated here -->
    </div>

    <script src="../resume-utils.js"></script>
    <script>
        async function loadResume() {
            try {
                const response = await fetch('../resume-data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                document.getElementById('loading').innerHTML = '<div class="text-red-600">Error loading resume data</div>';
            }
        }

        function renderResume(data) {
            const { personal, education, skills, experience, achievements, notableProjects, certifications, languages, projects, volunteer, awards, publications, courses, speaking, patents, interests, references } = data;

            document.getElementById('page-title').textContent = `${personal.name} - Resume`;

            let sectionNum = 1;

            const html = `
                <!-- Header -->
                <header class="gradient-header text-white py-16 print:py-8">
                    <div class="container mx-auto px-8 max-w-5xl">
                        <div class="flex items-center gap-6">
                            <div class="flex-1">
                                <h1 class="text-6xl font-bold mb-3 print:text-5xl">${personal.name}</h1>
                                <p class="text-2xl font-light mb-4 text-cyan-100">${personal.title}</p>
                                <div class="flex flex-wrap gap-4 text-sm">
                                    <span class="bg-white/20 px-3 py-1 rounded-full">${personal.email}</span>
                                    ${personal.phone ? `<span class="bg-white/20 px-3 py-1 rounded-full">${personal.phone}</span>` : ''}
                                    <span class="bg-white/20 px-3 py-1 rounded-full">${personal.location}</span>
                                    ${personal.linkedin ? `<span class="bg-white/20 px-3 py-1 rounded-full">${ResumeUtils.formatURL(personal.linkedin)}</span>` : ''}
                                    ${personal.github ? `<span class="bg-white/20 px-3 py-1 rounded-full">${ResumeUtils.formatURL(personal.github)}</span>` : ''}
                                    ${personal.website ? `<span class="bg-white/20 px-3 py-1 rounded-full">${ResumeUtils.formatURL(personal.website)}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </header>

                <div class="container mx-auto px-8 py-12 max-w-5xl">

                    <!-- Summary -->
                    <section class="mb-12 relative">
                        <span class="section-number">0${sectionNum++}</span>
                        <div class="accent-bar"></div>
                        <h2 class="text-3xl font-bold text-gray-900 mb-4">Professional Summary</h2>
                        <p class="text-gray-700 text-lg leading-relaxed">${personal.summary}</p>
                    </section>

                    <!-- Skills -->
                    <section class="mb-12 relative">
                        <span class="section-number">0${sectionNum++}</span>
                        <div class="accent-bar"></div>
                        <h2 class="text-3xl font-bold text-gray-900 mb-6">Technical Expertise</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${Object.entries(skills).map(([category, skillList]) => `
                                <div>
                                    <h3 class="text-lg font-semibold text-cyan-600 mb-3">${category}</h3>
                                    <div class="flex flex-wrap gap-2">
                                        ${skillList.map(skill => `
                                            <span class="skill-pill text-white px-4 py-2 rounded-full text-sm font-medium">${skill}</span>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- Experience -->
                    <section class="mb-12 relative">
                        <span class="section-number">0${sectionNum++}</span>
                        <div class="accent-bar"></div>
                        <h2 class="text-3xl font-bold text-gray-900 mb-6">Professional Experience</h2>
                        ${experience.map(exp => `
                            <div class="experience-card bg-white rounded-lg p-6 mb-6 shadow-md">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 class="text-2xl font-bold text-gray-900">${exp.company}</h3>
                                        <p class="text-cyan-600 font-semibold text-lg">${exp.position}</p>
                                        <p class="text-gray-600 text-sm">${exp.location}${exp.website ? ' | ' + exp.website : ''}</p>
                                    </div>
                                    <span class="bg-cyan-100 text-cyan-800 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap">
                                        ${exp.startDate} - ${exp.endDate}
                                    </span>
                                </div>

                                ${exp.projects.map(project => `
                                    <div class="mb-6 pl-4 border-l-2 border-gray-200">
                                        <h4 class="text-lg font-bold text-gray-800 mb-2">${project.name}</h4>
                                        <p class="text-sm text-gray-600 italic mb-2">${project.role}</p>
                                        <p class="text-gray-700 mb-3">${project.description}</p>

                                        ${project.achievements ? `
                                            <ul class="space-y-2 mb-3">
                                                ${project.achievements.map(achievement => `
                                                    <li class="flex items-start gap-2 text-sm text-gray-700">
                                                        <span class="text-cyan-600 font-bold">▸</span>
                                                        <span>${achievement}</span>
                                                    </li>
                                                `).join('')}
                                            </ul>
                                        ` : ''}

                                        ${project.subProjects ? project.subProjects.map(sub => `
                                            <div class="mb-3">
                                                <p class="font-semibold text-sm text-gray-800 mb-1">${sub.name}</p>
                                                <ul class="space-y-1">
                                                    ${sub.details.map(detail => `
                                                        <li class="flex items-start gap-2 text-sm text-gray-700">
                                                            <span class="text-cyan-600 font-bold">▸</span>
                                                            <span>${detail}</span>
                                                        </li>
                                                    `).join('')}
                                                </ul>
                                            </div>
                                        `).join('') : ''}

                                        <div class="flex flex-wrap gap-2 mt-3">
                                            ${project.techStack.map(tech => `
                                                <span class="bg-gray-100 text-gray-700 px-3 py-1 rounded text-xs font-medium">${tech}</span>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                    </section>

                    <!-- Notable Projects -->
                    ${ResumeUtils.hasData(notableProjects) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Featured Projects</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${notableProjects.map(project => `
                                    <div class="bg-gradient-to-br from-cyan-50 to-blue-50 border border-cyan-200 rounded-lg p-6 hover:shadow-lg transition">
                                        <h3 class="text-xl font-bold text-gray-900 mb-2">${project.name}</h3>
                                        <p class="text-gray-700 mb-3">${project.description}</p>
                                        <p class="text-sm text-cyan-600 font-semibold">${project.highlight}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- Personal Projects -->
                    ${ResumeUtils.hasData(projects) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Personal Projects</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${projects.map(project => `
                                    <div class="bg-white rounded-lg p-6 shadow-md hover:shadow-lg transition">
                                        <h3 class="text-xl font-bold text-gray-900 mb-2">${project.name}</h3>
                                        <p class="text-gray-700 mb-3">${project.description}</p>
                                        ${project.url ? `<a href="${project.url}" class="text-sm text-cyan-600 hover:underline">${ResumeUtils.formatURL(project.url)}</a>` : ''}
                                        ${project.highlights ? `
                                            <ul class="mt-3 space-y-1">
                                                ${project.highlights.map(h => `
                                                    <li class="flex items-start gap-2 text-sm text-gray-700">
                                                        <span class="text-cyan-600 font-bold">▸</span>
                                                        <span>${h}</span>
                                                    </li>
                                                `).join('')}
                                            </ul>
                                        ` : ''}
                                        ${project.techStack ? `
                                            <div class="flex flex-wrap gap-2 mt-3">
                                                ${project.techStack.map(tech => `
                                                    <span class="bg-gray-100 text-gray-700 px-3 py-1 rounded text-xs font-medium">${tech}</span>
                                                `).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- Education -->
                    <section class="mb-12 relative">
                        <span class="section-number">0${sectionNum++}</span>
                        <div class="accent-bar"></div>
                        <h2 class="text-3xl font-bold text-gray-900 mb-6">Education</h2>
                        ${education.map(edu => `
                            <div class="bg-white rounded-lg p-6 shadow-md">
                                <h3 class="text-xl font-bold text-gray-900">${edu.degree}</h3>
                                <p class="text-cyan-600 font-semibold text-lg">${edu.institution}</p>
                                <p class="text-gray-600">${edu.location}</p>
                                <div class="mt-3 flex items-center gap-4">
                                    <span class="bg-cyan-100 text-cyan-800 px-3 py-1 rounded-full text-sm font-semibold">CGPA: ${edu.cgpa}</span>
                                    <span class="text-gray-600">Class of ${edu.year}</span>
                                </div>
                                ${edu.honors ? `<p class="text-cyan-600 mt-2 font-medium">${edu.honors}</p>` : ''}
                            </div>
                        `).join('')}
                    </section>

                    <!-- Certifications -->
                    ${ResumeUtils.hasData(certifications) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Certifications</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${certifications.map(cert => `
                                    <div class="bg-white rounded-lg p-5 shadow-md border-l-4 border-cyan-500">
                                        <h3 class="text-lg font-bold text-gray-900">${cert.name}</h3>
                                        <p class="text-cyan-600">${cert.issuer}</p>
                                        <p class="text-gray-500 text-sm">${cert.date}${cert.expiryDate ? ' - ' + cert.expiryDate : ''}</p>
                                        ${cert.credentialId ? `<p class="text-xs text-gray-400 mt-1">ID: ${cert.credentialId}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- Awards -->
                    ${ResumeUtils.hasData(awards) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Awards & Honors</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${awards.map(award => `
                                    <div class="flex items-start gap-3">
                                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center flex-shrink-0">
                                            <span class="text-white text-lg">★</span>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-gray-900">${award.title}</h3>
                                            <p class="text-cyan-600 text-sm">${award.issuer} | ${award.date}</p>
                                            ${award.description ? `<p class="text-gray-600 text-sm mt-1">${award.description}</p>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- Publications -->
                    ${ResumeUtils.hasData(publications) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Publications</h2>
                            ${publications.map(pub => `
                                <div class="bg-white rounded-lg p-5 shadow-md mb-4">
                                    <h3 class="text-lg font-bold text-gray-900">${pub.title}</h3>
                                    <p class="text-cyan-600">${pub.publisher} | ${pub.date}</p>
                                    ${pub.description ? `<p class="text-gray-600 text-sm mt-2">${pub.description}</p>` : ''}
                                    ${pub.url ? `<a href="${pub.url}" class="text-cyan-500 text-sm hover:underline mt-2 inline-block">${ResumeUtils.formatURL(pub.url)}</a>` : ''}
                                </div>
                            `).join('')}
                        </section>
                    ` : ''}

                    <!-- Speaking -->
                    ${ResumeUtils.hasData(speaking) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Speaking Engagements</h2>
                            ${speaking.map(talk => `
                                <div class="bg-white rounded-lg p-5 shadow-md mb-4 border-l-4 border-blue-500">
                                    <h3 class="text-lg font-bold text-gray-900">${talk.title}</h3>
                                    <p class="text-cyan-600">${talk.event}</p>
                                    <p class="text-gray-500 text-sm">${talk.location} | ${talk.date}</p>
                                    ${talk.description ? `<p class="text-gray-600 text-sm mt-2">${talk.description}</p>` : ''}
                                </div>
                            `).join('')}
                        </section>
                    ` : ''}

                    <!-- Volunteer -->
                    ${ResumeUtils.hasData(volunteer) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Volunteer Experience</h2>
                            ${volunteer.map(vol => `
                                <div class="bg-white rounded-lg p-5 shadow-md mb-4">
                                    <h3 class="text-lg font-bold text-gray-900">${vol.organization}</h3>
                                    <p class="text-cyan-600">${vol.role}</p>
                                    <p class="text-gray-500 text-sm">${vol.startDate} - ${vol.endDate || 'Present'}</p>
                                    ${vol.description ? `<p class="text-gray-600 text-sm mt-2">${vol.description}</p>` : ''}
                                    ${vol.highlights ? `
                                        <ul class="mt-2 space-y-1">
                                            ${vol.highlights.map(h => `
                                                <li class="flex items-start gap-2 text-sm text-gray-700">
                                                    <span class="text-cyan-600 font-bold">▸</span>
                                                    <span>${h}</span>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </section>
                    ` : ''}

                    <!-- Courses -->
                    ${ResumeUtils.hasData(courses) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Courses & Training</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${courses.map(course => `
                                    <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                                        <h3 class="font-bold text-gray-900">${course.name}</h3>
                                        <p class="text-cyan-600 text-sm">${course.provider}</p>
                                        <p class="text-gray-500 text-xs">${course.date}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- Patents -->
                    ${ResumeUtils.hasData(patents) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Patents</h2>
                            ${patents.map(patent => `
                                <div class="bg-white rounded-lg p-5 shadow-md mb-4">
                                    <h3 class="text-lg font-bold text-gray-900">${patent.title}</h3>
                                    <p class="text-cyan-600">${patent.patentNumber} | ${patent.status}</p>
                                    <p class="text-gray-500 text-sm">${patent.date}</p>
                                    ${patent.description ? `<p class="text-gray-600 text-sm mt-2">${patent.description}</p>` : ''}
                                </div>
                            `).join('')}
                        </section>
                    ` : ''}

                    <!-- Achievements -->
                    ${ResumeUtils.hasData(achievements) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Key Achievements</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${achievements.map(achievement => `
                                    <div class="flex items-start gap-3">
                                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center flex-shrink-0 mt-1">
                                            <span class="text-white text-lg">✓</span>
                                        </div>
                                        <div>
                                            <p class="font-semibold text-gray-900">${achievement.title}</p>
                                            <p class="text-gray-700 text-sm">${achievement.description}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- Languages -->
                    ${ResumeUtils.hasData(languages) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Languages</h2>
                            <div class="flex flex-wrap gap-4">
                                ${languages.map(lang => `
                                    <div class="bg-white rounded-lg px-6 py-4 shadow-md text-center">
                                        <p class="font-bold text-gray-900">${lang.language}</p>
                                        <p class="text-cyan-600 text-sm">${lang.proficiency}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- Interests -->
                    ${ResumeUtils.hasData(interests) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">Interests</h2>
                            <div class="flex flex-wrap gap-3">
                                ${interests.map(interest => `
                                    <span class="bg-gradient-to-r from-cyan-50 to-blue-50 border border-cyan-200 px-5 py-2 rounded-full text-gray-700 font-medium">${interest}</span>
                                `).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- References -->
                    ${ResumeUtils.hasData(references) ? `
                        <section class="mb-12 relative">
                            <span class="section-number">0${sectionNum++}</span>
                            <div class="accent-bar"></div>
                            <h2 class="text-3xl font-bold text-gray-900 mb-6">References</h2>
                            ${references[0].name === 'Available upon request' ? `
                                <p class="text-gray-600 italic">Available upon request</p>
                            ` : `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    ${references.map(ref => `
                                        <div class="bg-white rounded-lg p-5 shadow-md">
                                            <h3 class="font-bold text-gray-900">${ref.name}</h3>
                                            <p class="text-cyan-600">${ref.title}${ref.company ? ' at ' + ref.company : ''}</p>
                                            ${ref.email ? `<p class="text-gray-500 text-sm mt-2">${ref.email}</p>` : ''}
                                            ${ref.phone ? `<p class="text-gray-500 text-sm">${ref.phone}</p>` : ''}
                                            ${ref.relationship ? `<p class="text-gray-400 text-xs mt-1">${ref.relationship}</p>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </section>
                    ` : ''}

                </div>

                <!-- Footer -->
                <footer class="bg-gray-900 text-white py-6 text-center no-print">
                    <p class="text-sm">Modern Bold Template</p>
                </footer>
            `;

            document.getElementById('resume-content').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resume-content').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', loadResume);
    </script>

</body>
</html>
