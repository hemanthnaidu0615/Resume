<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Resume - Two-Column Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        @media print {
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }

        .sidebar {
            background: linear-gradient(180deg, #E11D48 0%, #BE123C 100%);
        }

        .skill-dot {
            width: 8px;
            height: 8px;
            background: #FFF;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .section-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .layout-grid {
                grid-template-columns: 1fr !important;
            }
        }

        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div id="loading" class="text-center">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-rose-600"></div>
        <p class="mt-4 text-gray-600">Loading resume...</p>
    </div>

    <div id="resume-content" style="display: none;"></div>

    <script src="../resume-utils.js"></script>
    <script>
        async function loadResume() {
            try {
                const response = await fetch('../resume-data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                document.getElementById('loading').innerHTML = '<div class="text-red-600">Error loading resume data</div>';
            }
        }

        function renderResume(data) {
            const { personal, education, skills, experience, achievements, certifications, languages, projects, volunteer, awards, publications, courses, speaking, patents, interests, references } = data;

            document.getElementById('page-title').textContent = `${personal.name} - Resume`;

            const html = `
                <div class="max-w-6xl mx-auto bg-white shadow-2xl">
                    <div class="layout-grid grid grid-cols-3 min-h-screen">

                        <!-- Left Sidebar -->
                        <div class="sidebar col-span-1 p-8 text-white">
                            <!-- Name -->
                            <div class="mb-8">
                                <h1 class="text-3xl font-bold mb-2">${personal.name}</h1>
                                <div class="h-1 w-16 bg-white/50 mb-4"></div>
                                <p class="text-sm text-white/90">${personal.title}</p>
                            </div>

                            <!-- Contact -->
                            <div class="mb-8">
                                <div class="flex items-center gap-2 mb-4">
                                    <div class="section-icon text-xs">C</div>
                                    <h3 class="text-sm font-bold uppercase">Contact</h3>
                                </div>
                                <div class="space-y-2 text-sm text-white/90">
                                    <div class="break-words">${personal.email}</div>
                                    ${personal.phone ? `<div>${personal.phone}</div>` : ''}
                                    <div>${personal.location}</div>
                                    ${personal.linkedin ? `<div class="break-words">${ResumeUtils.formatURL(personal.linkedin)}</div>` : ''}
                                    ${personal.github ? `<div class="break-words">${ResumeUtils.formatURL(personal.github)}</div>` : ''}
                                    ${personal.website ? `<div class="break-words">${ResumeUtils.formatURL(personal.website)}</div>` : ''}
                                </div>
                            </div>

                            <!-- Skills -->
                            <div class="mb-8">
                                <div class="flex items-center gap-2 mb-4">
                                    <div class="section-icon text-xs">S</div>
                                    <h3 class="text-sm font-bold uppercase">Skills</h3>
                                </div>
                                ${Object.entries(skills).map(([category, skillList]) => `
                                    <div class="mb-4">
                                        <h4 class="text-xs font-semibold mb-2 text-white/70">${category}</h4>
                                        <div class="space-y-1">
                                            ${skillList.slice(0, 5).map(skill => `
                                                <div class="flex items-center text-xs text-white/90">
                                                    <span class="skill-dot"></span>
                                                    <span>${skill}</span>
                                                </div>
                                            `).join('')}
                                            ${skillList.length > 5 ? `<div class="text-xs text-white/60 ml-4">+${skillList.length - 5} more</div>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Education -->
                            <div class="mb-8">
                                <div class="flex items-center gap-2 mb-4">
                                    <div class="section-icon text-xs">E</div>
                                    <h3 class="text-sm font-bold uppercase">Education</h3>
                                </div>
                                ${education.map(edu => `
                                    <div class="mb-4">
                                        <h4 class="text-sm font-semibold">${edu.degree}</h4>
                                        <p class="text-xs text-white/80">${edu.institution}</p>
                                        <p class="text-xs text-white/70 mt-1">CGPA: ${edu.cgpa}</p>
                                        <p class="text-xs text-white/60">${edu.year}</p>
                                        ${edu.honors ? `<p class="text-xs text-white/70 mt-1">${edu.honors}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Certifications -->
                            ${ResumeUtils.hasData(certifications) ? `
                                <div class="mb-8">
                                    <div class="flex items-center gap-2 mb-4">
                                        <div class="section-icon text-xs">C</div>
                                        <h3 class="text-sm font-bold uppercase">Certifications</h3>
                                    </div>
                                    ${certifications.slice(0, 3).map(cert => `
                                        <div class="mb-3">
                                            <h4 class="text-xs font-semibold">${cert.name}</h4>
                                            <p class="text-xs text-white/70">${cert.issuer}</p>
                                            <p class="text-xs text-white/60">${cert.date}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                            <!-- Languages -->
                            ${ResumeUtils.hasData(languages) ? `
                                <div class="mb-8">
                                    <div class="flex items-center gap-2 mb-4">
                                        <div class="section-icon text-xs">L</div>
                                        <h3 class="text-sm font-bold uppercase">Languages</h3>
                                    </div>
                                    ${languages.map(lang => `
                                        <div class="flex items-center text-xs text-white/90 mb-2">
                                            <span class="skill-dot"></span>
                                            <span>${lang.language} - ${lang.proficiency}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                            <!-- Interests -->
                            ${ResumeUtils.hasData(interests) ? `
                                <div class="mb-8">
                                    <div class="flex items-center gap-2 mb-4">
                                        <div class="section-icon text-xs">I</div>
                                        <h3 class="text-sm font-bold uppercase">Interests</h3>
                                    </div>
                                    <div class="flex flex-wrap gap-2">
                                        ${interests.map(interest => `
                                            <span class="bg-white/20 px-2 py-1 rounded text-xs">${interest}</span>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Key Achievements -->
                            ${ResumeUtils.hasData(achievements) ? `
                                <div>
                                    <div class="flex items-center gap-2 mb-4">
                                        <div class="section-icon text-xs">H</div>
                                        <h3 class="text-sm font-bold uppercase">Highlights</h3>
                                    </div>
                                    <div class="space-y-2">
                                        ${achievements.slice(0, 4).map(achievement => `
                                            <div class="text-xs text-white/90">
                                                <span class="font-semibold">${achievement.title}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Right Main Content -->
                        <div class="col-span-2 p-8 bg-white">

                            <!-- Summary -->
                            <section class="mb-8">
                                <h2 class="text-2xl font-bold text-rose-600 mb-4 flex items-center gap-2">
                                    Professional Summary
                                </h2>
                                <p class="text-gray-700 leading-relaxed">${personal.summary}</p>
                            </section>

                            <!-- Experience -->
                            <section class="mb-8">
                                <h2 class="text-2xl font-bold text-rose-600 mb-6 flex items-center gap-2">
                                    Professional Experience
                                </h2>

                                ${experience.map(exp => `
                                    <div class="mb-8 border-l-4 border-rose-500 pl-6">
                                        <div class="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 class="text-xl font-bold text-gray-900">${exp.company}</h3>
                                                <p class="text-rose-600 font-semibold">${exp.position}</p>
                                                <p class="text-sm text-gray-600">${exp.location}</p>
                                            </div>
                                            <span class="bg-rose-100 text-rose-800 px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap">
                                                ${exp.startDate} - ${exp.endDate}
                                            </span>
                                        </div>

                                        ${exp.projects.map(project => `
                                            <div class="mt-4 bg-gray-50 rounded-lg p-4">
                                                <h4 class="font-bold text-gray-800 mb-1">${project.name}</h4>
                                                <p class="text-xs text-gray-600 italic mb-2">${project.role}</p>
                                                <p class="text-sm text-gray-700 mb-3">${project.description}</p>

                                                ${project.achievements ? `
                                                    <ul class="space-y-1 mb-3">
                                                        ${project.achievements.map(achievement => `
                                                            <li class="flex items-start gap-2 text-sm text-gray-700">
                                                                <span class="text-rose-500 font-bold mt-0.5">▸</span>
                                                                <span>${achievement}</span>
                                                            </li>
                                                        `).join('')}
                                                    </ul>
                                                ` : ''}

                                                ${project.subProjects ? project.subProjects.map(sub => `
                                                    <div class="mb-2">
                                                        <p class="font-semibold text-sm text-gray-800">${sub.name}</p>
                                                        <ul class="space-y-1">
                                                            ${sub.details.map(detail => `
                                                                <li class="flex items-start gap-2 text-sm text-gray-700">
                                                                    <span class="text-rose-500 font-bold mt-0.5">▸</span>
                                                                    <span>${detail}</span>
                                                                </li>
                                                            `).join('')}
                                                        </ul>
                                                    </div>
                                                `).join('') : ''}

                                                <div class="flex flex-wrap gap-2 mt-3">
                                                    ${project.techStack.map(tech => `
                                                        <span class="bg-white border border-rose-200 text-rose-700 px-2 py-1 rounded text-xs">${tech}</span>
                                                    `).join('')}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                `).join('')}
                            </section>

                            <!-- Personal Projects -->
                            ${ResumeUtils.hasData(projects) ? `
                                <section class="mb-8">
                                    <h2 class="text-2xl font-bold text-rose-600 mb-6">Personal Projects</h2>
                                    <div class="grid grid-cols-2 gap-4">
                                        ${projects.map(project => `
                                            <div class="bg-gray-50 rounded-lg p-4">
                                                <h3 class="font-bold text-gray-800 mb-1">${project.name}</h3>
                                                <p class="text-sm text-gray-600 mb-2">${project.description}</p>
                                                ${project.url ? `<a href="${project.url}" class="text-xs text-rose-500 hover:underline">${ResumeUtils.formatURL(project.url)}</a>` : ''}
                                                ${project.techStack ? `
                                                    <div class="flex flex-wrap gap-1 mt-2">
                                                        ${project.techStack.map(tech => `
                                                            <span class="bg-rose-50 text-rose-600 px-2 py-0.5 rounded text-xs">${tech}</span>
                                                        `).join('')}
                                                    </div>
                                                ` : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>
                            ` : ''}

                            <!-- Awards -->
                            ${ResumeUtils.hasData(awards) ? `
                                <section class="mb-8">
                                    <h2 class="text-2xl font-bold text-rose-600 mb-6">Awards & Honors</h2>
                                    <div class="space-y-3">
                                        ${awards.map(award => `
                                            <div class="flex items-start gap-3">
                                                <div class="w-8 h-8 rounded-full bg-yellow-100 flex items-center justify-center flex-shrink-0">
                                                    <span class="text-yellow-600">★</span>
                                                </div>
                                                <div>
                                                    <h3 class="font-bold text-gray-800">${award.title}</h3>
                                                    <p class="text-sm text-gray-600">${award.issuer} | ${award.date}</p>
                                                    ${award.description ? `<p class="text-sm text-gray-500 mt-1">${award.description}</p>` : ''}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>
                            ` : ''}

                            <!-- Publications -->
                            ${ResumeUtils.hasData(publications) ? `
                                <section class="mb-8">
                                    <h2 class="text-2xl font-bold text-rose-600 mb-6">Publications</h2>
                                    ${publications.map(pub => `
                                        <div class="mb-4 bg-gray-50 rounded-lg p-4">
                                            <h3 class="font-bold text-gray-800">${pub.title}</h3>
                                            <p class="text-sm text-rose-600">${pub.publisher} | ${pub.date}</p>
                                            ${pub.description ? `<p class="text-sm text-gray-600 mt-2">${pub.description}</p>` : ''}
                                        </div>
                                    `).join('')}
                                </section>
                            ` : ''}

                            <!-- Volunteer -->
                            ${ResumeUtils.hasData(volunteer) ? `
                                <section class="mb-8">
                                    <h2 class="text-2xl font-bold text-rose-600 mb-6">Volunteer Experience</h2>
                                    ${volunteer.map(vol => `
                                        <div class="mb-4 border-l-4 border-rose-200 pl-4">
                                            <h3 class="font-bold text-gray-800">${vol.organization}</h3>
                                            <p class="text-rose-600">${vol.role}</p>
                                            <p class="text-sm text-gray-500">${vol.startDate} - ${vol.endDate || 'Present'}</p>
                                            ${vol.description ? `<p class="text-sm text-gray-600 mt-2">${vol.description}</p>` : ''}
                                        </div>
                                    `).join('')}
                                </section>
                            ` : ''}

                            <!-- References -->
                            ${ResumeUtils.hasData(references) && references[0].name !== 'Available upon request' ? `
                                <section class="mb-8">
                                    <h2 class="text-2xl font-bold text-rose-600 mb-6">References</h2>
                                    <div class="grid grid-cols-2 gap-4">
                                        ${references.map(ref => `
                                            <div class="bg-gray-50 rounded-lg p-4">
                                                <h3 class="font-bold text-gray-800">${ref.name}</h3>
                                                <p class="text-sm text-rose-600">${ref.title}${ref.company ? ' at ' + ref.company : ''}</p>
                                                ${ref.email ? `<p class="text-xs text-gray-500 mt-1">${ref.email}</p>` : ''}
                                                ${ref.phone ? `<p class="text-xs text-gray-500">${ref.phone}</p>` : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>
                            ` : ResumeUtils.hasData(references) ? `
                                <section class="mb-8">
                                    <h2 class="text-2xl font-bold text-rose-600 mb-6">References</h2>
                                    <p class="text-gray-600 italic">Available upon request</p>
                                </section>
                            ` : ''}
                        </div>

                    </div>
                </div>
            `;

            document.getElementById('resume-content').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resume-content').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', loadResume);
    </script>

</body>
</html>
