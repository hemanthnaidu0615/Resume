<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Resume - Two-Column Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        @media print {
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }

        .sidebar {
            background: linear-gradient(180deg, #E11D48 0%, #BE123C 100%);
        }

        .skill-dot {
            width: 8px;
            height: 8px;
            background: #FFF;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .section-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .layout-grid {
                grid-template-columns: 1fr !important;
            }
        }

        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div id="loading" class="text-center">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-rose-600"></div>
        <p class="mt-4 text-gray-600">Loading resume...</p>
    </div>

    <div id="resume-content" style="display: none;">
        <!-- Content will be generated here -->
    </div>

    <script>
        async function loadResume() {
            try {
                const response = await fetch('../resume-data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                document.getElementById('loading').innerHTML = '<div class="text-red-600">Error loading resume data</div>';
            }
        }

        function renderResume(data) {
            const { personal, education, skills, experience, achievements } = data;

            document.getElementById('page-title').textContent = `${personal.name} - Resume`;

            const html = `
                <div class="max-w-6xl mx-auto bg-white shadow-2xl">
                    <div class="layout-grid grid grid-cols-3 min-h-screen">

                        <!-- Left Sidebar -->
                        <div class="sidebar col-span-1 p-8 text-white">
                            <!-- Name -->
                            <div class="mb-8">
                                <h1 class="text-3xl font-bold mb-2">${personal.name}</h1>
                                <div class="h-1 w-16 bg-white/50 mb-4"></div>
                                <p class="text-sm text-white/90">${personal.title}</p>
                            </div>

                            <!-- Contact -->
                            <div class="mb-8">
                                <div class="flex items-center gap-2 mb-4">
                                    <div class="section-icon text-xs">📧</div>
                                    <h3 class="text-sm font-bold uppercase">Contact</h3>
                                </div>
                                <div class="space-y-2 text-sm text-white/90">
                                    <div class="break-words">${personal.email}</div>
                                    ${personal.phone ? `<div>${personal.phone}</div>` : ''}
                                    <div>${personal.location}</div>
                                    ${personal.linkedin ? `<div class="break-words">${personal.linkedin.replace('https://', '')}</div>` : ''}
                                    ${personal.github ? `<div class="break-words">${personal.github.replace('https://', '')}</div>` : ''}
                                </div>
                            </div>

                            <!-- Skills -->
                            <div class="mb-8">
                                <div class="flex items-center gap-2 mb-4">
                                    <div class="section-icon text-xs">💻</div>
                                    <h3 class="text-sm font-bold uppercase">Skills</h3>
                                </div>
                                ${Object.entries(skills).map(([category, skillList]) => `
                                    <div class="mb-4">
                                        <h4 class="text-xs font-semibold mb-2 text-white/70">${category}</h4>
                                        <div class="space-y-1">
                                            ${skillList.slice(0, 5).map(skill => `
                                                <div class="flex items-center text-xs text-white/90">
                                                    <span class="skill-dot"></span>
                                                    <span>${skill}</span>
                                                </div>
                                            `).join('')}
                                            ${skillList.length > 5 ? `<div class="text-xs text-white/60 ml-4">+${skillList.length - 5} more</div>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Education -->
                            <div class="mb-8">
                                <div class="flex items-center gap-2 mb-4">
                                    <div class="section-icon text-xs">🎓</div>
                                    <h3 class="text-sm font-bold uppercase">Education</h3>
                                </div>
                                ${education.map(edu => `
                                    <div class="mb-4">
                                        <h4 class="text-sm font-semibold">${edu.degree}</h4>
                                        <p class="text-xs text-white/80">${edu.institution}</p>
                                        <p class="text-xs text-white/70 mt-1">CGPA: ${edu.cgpa}</p>
                                        <p class="text-xs text-white/60">${edu.year}</p>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Key Achievements -->
                            ${achievements && achievements.length ? `
                                <div>
                                    <div class="flex items-center gap-2 mb-4">
                                        <div class="section-icon text-xs">⭐</div>
                                        <h3 class="text-sm font-bold uppercase">Highlights</h3>
                                    </div>
                                    <div class="space-y-2">
                                        ${achievements.slice(0, 4).map(achievement => `
                                            <div class="text-xs text-white/90">
                                                <span class="font-semibold">${achievement.title}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Right Main Content -->
                        <div class="col-span-2 p-8 bg-white">

                            <!-- Summary -->
                            <section class="mb-8">
                                <h2 class="text-2xl font-bold text-rose-600 mb-4 flex items-center gap-2">
                                    <span class="text-3xl">👤</span>
                                    Professional Summary
                                </h2>
                                <p class="text-gray-700 leading-relaxed">${personal.summary}</p>
                            </section>

                            <!-- Experience -->
                            <section>
                                <h2 class="text-2xl font-bold text-rose-600 mb-6 flex items-center gap-2">
                                    <span class="text-3xl">💼</span>
                                    Professional Experience
                                </h2>

                                ${experience.map(exp => `
                                    <div class="mb-8 border-l-4 border-rose-500 pl-6">
                                        <div class="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 class="text-xl font-bold text-gray-900">${exp.company}</h3>
                                                <p class="text-rose-600 font-semibold">${exp.position}</p>
                                                <p class="text-sm text-gray-600">${exp.location}</p>
                                            </div>
                                            <span class="bg-rose-100 text-rose-800 px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap">
                                                ${exp.startDate} - ${exp.endDate}
                                            </span>
                                        </div>

                                        ${exp.projects.map(project => `
                                            <div class="mt-4 bg-gray-50 rounded-lg p-4">
                                                <h4 class="font-bold text-gray-800 mb-1">${project.name}</h4>
                                                <p class="text-xs text-gray-600 italic mb-2">${project.role}</p>
                                                <p class="text-sm text-gray-700 mb-3">${project.description}</p>

                                                ${project.achievements ? `
                                                    <ul class="space-y-1 mb-3">
                                                        ${project.achievements.map(achievement => `
                                                            <li class="flex items-start gap-2 text-sm text-gray-700">
                                                                <span class="text-rose-500 font-bold mt-0.5">▸</span>
                                                                <span>${achievement}</span>
                                                            </li>
                                                        `).join('')}
                                                    </ul>
                                                ` : ''}

                                                ${project.subProjects ? project.subProjects.map(sub => `
                                                    <div class="mb-2">
                                                        <p class="font-semibold text-sm text-gray-800">${sub.name}</p>
                                                        <ul class="space-y-1">
                                                            ${sub.details.map(detail => `
                                                                <li class="flex items-start gap-2 text-sm text-gray-700">
                                                                    <span class="text-rose-500 font-bold mt-0.5">▸</span>
                                                                    <span>${detail}</span>
                                                                </li>
                                                            `).join('')}
                                                        </ul>
                                                    </div>
                                                `).join('') : ''}

                                                <div class="flex flex-wrap gap-2 mt-3">
                                                    ${project.techStack.map(tech => `
                                                        <span class="bg-white border border-rose-200 text-rose-700 px-2 py-1 rounded text-xs">${tech}</span>
                                                    `).join('')}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                `).join('')}
                            </section>
                        </div>

                    </div>
                </div>
            `;

            document.getElementById('resume-content').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resume-content').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', loadResume);
    </script>

</body>
</html>
