<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Resume - Classic Traditional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.7;
            color: #1E293B;
            background: #fff;
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 70px;
        }

        @media print {
            body {
                padding: 30px;
            }
        }

        /* Header */
        header {
            text-align: center;
            border-bottom: 3px double #334155;
            padding-bottom: 25px;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #1E293B;
        }

        .title {
            font-size: 16px;
            font-style: italic;
            color: #475569;
            margin-bottom: 20px;
        }

        .contact {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 13px;
            color: #334155;
        }

        .contact-item {
            position: relative;
        }

        .contact-item:not(:last-child)::after {
            content: "•";
            position: absolute;
            right: -12px;
            color: #94A3B8;
        }

        /* Sections */
        section {
            margin-bottom: 35px;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #334155;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1E293B;
        }

        /* Summary */
        .summary {
            font-size: 15px;
            line-height: 1.8;
            text-align: justify;
            color: #334155;
        }

        /* Education */
        .education-item {
            margin-bottom: 20px;
        }

        .education-item h3 {
            margin-bottom: 4px;
        }

        .institution {
            font-size: 16px;
            font-style: italic;
            color: #475569;
            margin-bottom: 4px;
        }

        .details {
            font-size: 14px;
            color: #64748B;
        }

        /* Skills */
        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .skill-category h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #334155;
        }

        .skill-list {
            font-size: 14px;
            color: #475569;
            line-height: 1.8;
        }

        /* Experience */
        .experience-item {
            margin-bottom: 30px;
            page-break-inside: avoid;
        }

        .experience-header {
            margin-bottom: 8px;
        }

        .company-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .company-name {
            font-size: 18px;
            font-weight: 700;
            color: #1E293B;
        }

        .date-range {
            font-size: 13px;
            font-style: italic;
            color: #64748B;
        }

        .position {
            font-size: 15px;
            font-style: italic;
            color: #475569;
            margin-bottom: 4px;
        }

        .location {
            font-size: 13px;
            color: #64748B;
            margin-bottom: 12px;
        }

        .project {
            margin-bottom: 18px;
            padding-left: 20px;
            border-left: 3px solid #E2E8F0;
        }

        .project-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #334155;
        }

        .project-role {
            font-size: 13px;
            font-style: italic;
            color: #64748B;
            margin-bottom: 6px;
        }

        .project-desc {
            font-size: 14px;
            margin-bottom: 8px;
            color: #475569;
        }

        ul {
            list-style: none;
            padding-left: 0;
            margin: 10px 0;
        }

        li {
            font-size: 14px;
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
            color: #475569;
        }

        li:before {
            content: "–";
            position: absolute;
            left: 0;
            font-weight: bold;
            color: #64748B;
        }

        .tech-stack {
            font-size: 12px;
            color: #64748B;
            font-style: italic;
            margin-top: 6px;
        }

        .tech-stack strong {
            color: #475569;
            font-style: normal;
        }

        /* Achievements */
        .achievements-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .achievement-item {
            font-size: 14px;
            padding-left: 25px;
            position: relative;
            color: #475569;
        }

        .achievement-item:before {
            content: "◆";
            position: absolute;
            left: 0;
            color: #64748B;
        }

        .achievement-title {
            font-weight: 600;
            color: #334155;
        }

        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .notable-project {
            border: 1px solid #CBD5E1;
            padding: 15px;
            border-radius: 4px;
        }

        .notable-project h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .notable-project p {
            font-size: 13px;
            color: #475569;
        }

        .notable-project .highlight {
            font-size: 12px;
            font-style: italic;
            color: #64748B;
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            body {
                padding: 30px;
            }

            h1 {
                font-size: 32px;
            }

            .skills-grid,
            .projects-grid {
                grid-template-columns: 1fr;
            }

            .company-info {
                flex-direction: column;
            }
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: #64748B;
        }
    </style>
</head>
<body>

    <div id="loading">Loading resume data...</div>

    <div id="resume-content" style="display: none;">
        <!-- Content will be generated here -->
    </div>

    <script>
        async function loadResume() {
            try {
                const response = await fetch('../resume-data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading resume data.';
            }
        }

        function renderResume(data) {
            const { personal, education, skills, experience, achievements, notableProjects } = data;

            document.getElementById('page-title').textContent = `${personal.name} - Curriculum Vitae`;

            const html = `
                <header>
                    <h1>${personal.name}</h1>
                    <div class="title">${personal.title}</div>
                    <div class="contact">
                        <span class="contact-item">${personal.email}</span>
                        ${personal.phone ? `<span class="contact-item">${personal.phone}</span>` : ''}
                        <span class="contact-item">${personal.location}</span>
                        ${personal.linkedin ? `<span class="contact-item">${personal.linkedin.replace('https://', '')}</span>` : ''}
                        ${personal.github ? `<span class="contact-item">${personal.github.replace('https://', '')}</span>` : ''}
                    </div>
                </header>

                <section>
                    <h2>Professional Summary</h2>
                    <div class="summary">${personal.summary}</div>
                </section>

                <section>
                    <h2>Education</h2>
                    ${education.map(edu => `
                        <div class="education-item">
                            <h3>${edu.degree}</h3>
                            <div class="institution">${edu.institution}</div>
                            <div class="details">${edu.location} | CGPA: ${edu.cgpa} | Graduated ${edu.year}</div>
                        </div>
                    `).join('')}
                </section>

                <section>
                    <h2>Professional Experience</h2>
                    ${experience.map(exp => `
                        <div class="experience-item">
                            <div class="experience-header">
                                <div class="company-info">
                                    <span class="company-name">${exp.company}</span>
                                    <span class="date-range">${exp.startDate} – ${exp.endDate}</span>
                                </div>
                                <div class="position">${exp.position}</div>
                                <div class="location">${exp.location}${exp.website ? ' | ' + exp.website : ''}</div>
                            </div>

                            ${exp.projects.map(project => `
                                <div class="project">
                                    <div class="project-name">${project.name}</div>
                                    <div class="project-role">${project.role}</div>
                                    <div class="project-desc">${project.description}</div>

                                    ${project.achievements ? `
                                        <ul>
                                            ${project.achievements.map(achievement => `<li>${achievement}</li>`).join('')}
                                        </ul>
                                    ` : ''}

                                    ${project.subProjects ? project.subProjects.map(sub => `
                                        <div style="margin-top: 10px;">
                                            <strong style="font-size: 14px;">${sub.name}:</strong>
                                            <ul>
                                                ${sub.details.map(detail => `<li>${detail}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `).join('') : ''}

                                    <div class="tech-stack">
                                        <strong>Technologies:</strong> ${project.techStack.join(', ')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </section>

                <section>
                    <h2>Technical Skills</h2>
                    <div class="skills-grid">
                        ${Object.entries(skills).map(([category, skillList]) => `
                            <div class="skill-category">
                                <h3>${category}</h3>
                                <div class="skill-list">${skillList.join(', ')}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>

                ${notableProjects && notableProjects.length ? `
                    <section>
                        <h2>Featured Projects</h2>
                        <div class="projects-grid">
                            ${notableProjects.map(project => `
                                <div class="notable-project">
                                    <h3>${project.name}</h3>
                                    <p>${project.description}</p>
                                    <div class="highlight">${project.highlight}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}

                ${achievements && achievements.length ? `
                    <section>
                        <h2>Key Achievements</h2>
                        <div class="achievements-grid">
                            ${achievements.map(achievement => `
                                <div class="achievement-item">
                                    <span class="achievement-title">${achievement.title}:</span> ${achievement.description}
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}
            `;

            document.getElementById('resume-content').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resume-content').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', loadResume);
    </script>

</body>
</html>
