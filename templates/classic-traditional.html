<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Resume - Classic Traditional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.7;
            color: #1E293B;
            background: #fff;
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 70px;
        }

        @media print {
            body {
                padding: 30px;
            }
        }

        header {
            text-align: center;
            border-bottom: 3px double #334155;
            padding-bottom: 25px;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #1E293B;
        }

        .title {
            font-size: 16px;
            font-style: italic;
            color: #475569;
            margin-bottom: 20px;
        }

        .contact {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 13px;
            color: #334155;
        }

        .contact-item {
            position: relative;
        }

        .contact-item:not(:last-child)::after {
            content: "•";
            position: absolute;
            right: -12px;
            color: #94A3B8;
        }

        section {
            margin-bottom: 35px;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #334155;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1E293B;
        }

        .summary {
            font-size: 15px;
            line-height: 1.8;
            text-align: justify;
            color: #334155;
        }

        .education-item {
            margin-bottom: 20px;
        }

        .education-item h3 {
            margin-bottom: 4px;
        }

        .institution {
            font-size: 16px;
            font-style: italic;
            color: #475569;
            margin-bottom: 4px;
        }

        .details {
            font-size: 14px;
            color: #64748B;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .skill-category h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #334155;
        }

        .skill-list {
            font-size: 14px;
            color: #475569;
            line-height: 1.8;
        }

        .experience-item {
            margin-bottom: 30px;
            page-break-inside: avoid;
        }

        .experience-header {
            margin-bottom: 8px;
        }

        .company-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .company-name {
            font-size: 18px;
            font-weight: 700;
            color: #1E293B;
        }

        .date-range {
            font-size: 13px;
            font-style: italic;
            color: #64748B;
        }

        .position {
            font-size: 15px;
            font-style: italic;
            color: #475569;
            margin-bottom: 4px;
        }

        .location {
            font-size: 13px;
            color: #64748B;
            margin-bottom: 12px;
        }

        .project {
            margin-bottom: 18px;
            padding-left: 20px;
            border-left: 3px solid #E2E8F0;
        }

        .project-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #334155;
        }

        .project-role {
            font-size: 13px;
            font-style: italic;
            color: #64748B;
            margin-bottom: 6px;
        }

        .project-desc {
            font-size: 14px;
            margin-bottom: 8px;
            color: #475569;
        }

        ul {
            list-style: none;
            padding-left: 0;
            margin: 10px 0;
        }

        li {
            font-size: 14px;
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
            color: #475569;
        }

        li:before {
            content: "–";
            position: absolute;
            left: 0;
            font-weight: bold;
            color: #64748B;
        }

        .tech-stack {
            font-size: 12px;
            color: #64748B;
            font-style: italic;
            margin-top: 6px;
        }

        .tech-stack strong {
            color: #475569;
            font-style: normal;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .achievement-item {
            font-size: 14px;
            padding-left: 25px;
            position: relative;
            color: #475569;
        }

        .achievement-item:before {
            content: "◆";
            position: absolute;
            left: 0;
            color: #64748B;
        }

        .achievement-title {
            font-weight: 600;
            color: #334155;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .notable-project {
            border: 1px solid #CBD5E1;
            padding: 15px;
            border-radius: 4px;
        }

        .notable-project h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .notable-project p {
            font-size: 13px;
            color: #475569;
        }

        .notable-project .highlight {
            font-size: 12px;
            font-style: italic;
            color: #64748B;
            margin-top: 6px;
        }

        .cert-item, .award-item, .pub-item {
            margin-bottom: 15px;
        }

        .cert-name, .award-title-text, .pub-title {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }

        .cert-details, .award-details, .pub-details {
            font-size: 13px;
            color: #64748B;
            font-style: italic;
        }

        .languages-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .language-item {
            font-size: 14px;
        }

        .language-name {
            font-weight: 600;
            color: #334155;
        }

        .language-level {
            color: #64748B;
            font-style: italic;
        }

        .interests-list {
            font-size: 14px;
            color: #475569;
            line-height: 1.8;
        }

        .volunteer-item {
            margin-bottom: 15px;
            padding-left: 20px;
            border-left: 3px solid #E2E8F0;
        }

        .volunteer-org {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }

        .volunteer-role {
            font-size: 14px;
            font-style: italic;
            color: #475569;
        }

        .volunteer-dates {
            font-size: 13px;
            color: #64748B;
        }

        @media (max-width: 768px) {
            body {
                padding: 30px;
            }

            h1 {
                font-size: 32px;
            }

            .skills-grid,
            .projects-grid {
                grid-template-columns: 1fr;
            }

            .company-info {
                flex-direction: column;
            }
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: #64748B;
        }
    </style>
</head>
<body>

    <div id="loading">Loading resume data...</div>

    <div id="resume-content" style="display: none;"></div>

    <script src="../resume-utils.js"></script>
    <script>
        async function loadResume() {
            try {
                const response = await fetch('../resume-data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading resume data.';
            }
        }

        function renderResume(data) {
            const { personal, education, skills, experience, achievements, notableProjects, certifications, languages, projects, volunteer, awards, publications, courses, speaking, patents, interests, references } = data;

            document.getElementById('page-title').textContent = `${personal.name} - Curriculum Vitae`;

            let html = `
                <header>
                    <h1>${personal.name}</h1>
                    <div class="title">${personal.title}</div>
                    <div class="contact">
                        <span class="contact-item">${personal.email}</span>
                        ${personal.phone ? `<span class="contact-item">${personal.phone}</span>` : ''}
                        <span class="contact-item">${personal.location}</span>
                        ${personal.linkedin ? `<span class="contact-item">${ResumeUtils.formatURL(personal.linkedin)}</span>` : ''}
                        ${personal.github ? `<span class="contact-item">${ResumeUtils.formatURL(personal.github)}</span>` : ''}
                    </div>
                </header>

                <section>
                    <h2>Professional Summary</h2>
                    <div class="summary">${personal.summary}</div>
                </section>

                <section>
                    <h2>Education</h2>
                    ${education.map(edu => `
                        <div class="education-item">
                            <h3>${edu.degree}</h3>
                            <div class="institution">${edu.institution}</div>
                            <div class="details">${edu.location} | CGPA: ${edu.cgpa} | Graduated ${edu.year}</div>
                            ${edu.honors ? `<div class="details" style="font-style: italic;">${edu.honors}</div>` : ''}
                        </div>
                    `).join('')}
                </section>

                <section>
                    <h2>Professional Experience</h2>
                    ${experience.map(exp => `
                        <div class="experience-item">
                            <div class="experience-header">
                                <div class="company-info">
                                    <span class="company-name">${exp.company}</span>
                                    <span class="date-range">${exp.startDate} – ${exp.endDate}</span>
                                </div>
                                <div class="position">${exp.position}</div>
                                <div class="location">${exp.location}${exp.website ? ' | ' + exp.website : ''}</div>
                            </div>

                            ${exp.projects.map(project => `
                                <div class="project">
                                    <div class="project-name">${project.name}</div>
                                    <div class="project-role">${project.role}</div>
                                    <div class="project-desc">${project.description}</div>

                                    ${project.achievements ? `
                                        <ul>
                                            ${project.achievements.map(achievement => `<li>${achievement}</li>`).join('')}
                                        </ul>
                                    ` : ''}

                                    ${project.subProjects ? project.subProjects.map(sub => `
                                        <div style="margin-top: 10px;">
                                            <strong style="font-size: 14px;">${sub.name}:</strong>
                                            <ul>
                                                ${sub.details.map(detail => `<li>${detail}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `).join('') : ''}

                                    <div class="tech-stack">
                                        <strong>Technologies:</strong> ${project.techStack.join(', ')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </section>

                <section>
                    <h2>Technical Skills</h2>
                    <div class="skills-grid">
                        ${Object.entries(skills).map(([category, skillList]) => `
                            <div class="skill-category">
                                <h3>${category}</h3>
                                <div class="skill-list">${skillList.join(', ')}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>

                ${ResumeUtils.hasData(certifications) ? `
                    <section>
                        <h2>Certifications</h2>
                        ${certifications.map(cert => `
                            <div class="cert-item">
                                <div class="cert-name">${cert.name}</div>
                                <div class="cert-details">${cert.issuer} | ${cert.date}${cert.expiryDate ? ' – ' + cert.expiryDate : ''}${cert.credentialId ? ' | ID: ' + cert.credentialId : ''}</div>
                            </div>
                        `).join('')}
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(notableProjects) ? `
                    <section>
                        <h2>Featured Projects</h2>
                        <div class="projects-grid">
                            ${notableProjects.map(project => `
                                <div class="notable-project">
                                    <h3>${project.name}</h3>
                                    <p>${project.description}</p>
                                    <div class="highlight">${project.highlight}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(projects) ? `
                    <section>
                        <h2>Personal Projects</h2>
                        ${projects.map(project => `
                            <div class="project">
                                <div class="project-name">${project.name}${project.url ? ` – <a href="${project.url}" style="color: #64748B; font-size: 13px;">${ResumeUtils.formatURL(project.url)}</a>` : ''}</div>
                                <div class="project-desc">${project.description}</div>
                                ${project.highlights ? `
                                    <ul>
                                        ${project.highlights.map(h => `<li>${h}</li>`).join('')}
                                    </ul>
                                ` : ''}
                                ${project.techStack ? `
                                    <div class="tech-stack"><strong>Technologies:</strong> ${project.techStack.join(', ')}</div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(awards) ? `
                    <section>
                        <h2>Awards & Honors</h2>
                        ${awards.map(award => `
                            <div class="award-item">
                                <div class="award-title-text">${award.title}</div>
                                <div class="award-details">${award.issuer} | ${award.date}</div>
                                ${award.description ? `<div class="project-desc">${award.description}</div>` : ''}
                            </div>
                        `).join('')}
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(publications) ? `
                    <section>
                        <h2>Publications</h2>
                        ${publications.map(pub => `
                            <div class="pub-item">
                                <div class="pub-title">${pub.title}</div>
                                <div class="pub-details">${pub.publisher} | ${pub.date}</div>
                                ${pub.description ? `<div class="project-desc">${pub.description}</div>` : ''}
                            </div>
                        `).join('')}
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(speaking) ? `
                    <section>
                        <h2>Speaking Engagements</h2>
                        ${speaking.map(talk => `
                            <div class="pub-item">
                                <div class="pub-title">${talk.title}</div>
                                <div class="pub-details">${talk.event} | ${talk.location} | ${talk.date}</div>
                                ${talk.description ? `<div class="project-desc">${talk.description}</div>` : ''}
                            </div>
                        `).join('')}
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(volunteer) ? `
                    <section>
                        <h2>Volunteer Experience</h2>
                        ${volunteer.map(vol => `
                            <div class="volunteer-item">
                                <div class="volunteer-org">${vol.organization}</div>
                                <div class="volunteer-role">${vol.role}</div>
                                <div class="volunteer-dates">${vol.startDate} – ${vol.endDate || 'Present'}</div>
                                ${vol.description ? `<div class="project-desc">${vol.description}</div>` : ''}
                                ${vol.highlights ? `
                                    <ul>
                                        ${vol.highlights.map(h => `<li>${h}</li>`).join('')}
                                    </ul>
                                ` : ''}
                            </div>
                        `).join('')}
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(courses) ? `
                    <section>
                        <h2>Courses & Training</h2>
                        ${courses.map(course => `
                            <div class="cert-item">
                                <div class="cert-name">${course.name}</div>
                                <div class="cert-details">${course.provider} | ${course.date}</div>
                            </div>
                        `).join('')}
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(patents) ? `
                    <section>
                        <h2>Patents</h2>
                        ${patents.map(patent => `
                            <div class="pub-item">
                                <div class="pub-title">${patent.title}</div>
                                <div class="pub-details">${patent.patentNumber} | ${patent.status} | ${patent.date}</div>
                                ${patent.description ? `<div class="project-desc">${patent.description}</div>` : ''}
                            </div>
                        `).join('')}
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(achievements) ? `
                    <section>
                        <h2>Key Achievements</h2>
                        <div class="achievements-grid">
                            ${achievements.map(achievement => `
                                <div class="achievement-item">
                                    <span class="achievement-title">${achievement.title}:</span> ${achievement.description}
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(languages) ? `
                    <section>
                        <h2>Languages</h2>
                        <div class="languages-grid">
                            ${languages.map(lang => `
                                <div class="language-item">
                                    <span class="language-name">${lang.language}</span>
                                    <span class="language-level"> – ${lang.proficiency}</span>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(interests) ? `
                    <section>
                        <h2>Interests</h2>
                        <div class="interests-list">${interests.join(' • ')}</div>
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(references) ? `
                    <section>
                        <h2>References</h2>
                        ${references[0].name === 'Available upon request' ? `
                            <div class="project-desc" style="font-style: italic;">Available upon request</div>
                        ` : `
                            ${references.map(ref => `
                                <div class="cert-item">
                                    <div class="cert-name">${ref.name}</div>
                                    <div class="cert-details">${ref.title}${ref.company ? ' at ' + ref.company : ''}</div>
                                    ${ref.email ? `<div class="cert-details">${ref.email}${ref.phone ? ' | ' + ref.phone : ''}</div>` : ''}
                                </div>
                            `).join('')}
                        `}
                    </section>
                ` : ''}
            `;

            document.getElementById('resume-content').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resume-content').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', loadResume);
    </script>

</body>
</html>
