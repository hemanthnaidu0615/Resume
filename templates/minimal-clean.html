<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Resume - Minimal Clean</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            line-height: 1.6;
            color: #000;
            background: #fff;
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 60px;
        }

        @media print {
            body {
                padding: 20px;
            }
        }

        /* Header */
        header {
            border-bottom: 3px solid #000;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .title {
            font-size: 14px;
            color: #4B5563;
            margin-bottom: 15px;
        }

        .contact {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 12px;
            color: #374151;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Sections */
        section {
            margin-bottom: 30px;
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        /* Summary */
        .summary {
            font-size: 14px;
            line-height: 1.7;
            color: #374151;
        }

        /* Education */
        .education-item {
            margin-bottom: 15px;
        }

        .education-item h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .education-item .institution {
            font-size: 14px;
            font-weight: 500;
            color: #000;
        }

        .education-item .details {
            font-size: 13px;
            color: #6B7280;
        }

        /* Skills */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .skill-category h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-badge {
            background: #F3F4F6;
            border: 1px solid #D1D5DB;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 3px;
        }

        /* Experience */
        .experience-item {
            margin-bottom: 25px;
        }

        .experience-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .company-name {
            font-size: 16px;
            font-weight: 700;
        }

        .date-range {
            font-size: 12px;
            color: #6B7280;
            white-space: nowrap;
        }

        .position {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
        }

        .location {
            font-size: 12px;
            color: #6B7280;
            margin-bottom: 10px;
        }

        .project {
            margin-bottom: 15px;
            padding-left: 15px;
        }

        .project-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .project-role {
            font-size: 12px;
            font-style: italic;
            color: #6B7280;
            margin-bottom: 5px;
        }

        .project-desc {
            font-size: 13px;
            margin-bottom: 5px;
            color: #374151;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            font-size: 12px;
            margin-bottom: 3px;
            padding-left: 15px;
            position: relative;
            color: #374151;
        }

        li:before {
            content: "•";
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 5px;
        }

        .tech-badge {
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            padding: 2px 8px;
            font-size: 10px;
            border-radius: 2px;
        }

        /* Achievements */
        .achievements-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .achievement-item {
            font-size: 13px;
            padding-left: 20px;
            position: relative;
        }

        .achievement-item:before {
            content: "✓";
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .achievement-title {
            font-weight: 600;
        }

        /* Certifications */
        .cert-item {
            margin-bottom: 12px;
        }

        .cert-name {
            font-size: 14px;
            font-weight: 600;
        }

        .cert-issuer {
            font-size: 12px;
            color: #6B7280;
        }

        /* Languages */
        .languages-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .language-item {
            font-size: 13px;
        }

        .language-name {
            font-weight: 600;
        }

        .language-level {
            color: #6B7280;
            font-size: 12px;
        }

        /* Projects */
        .personal-project {
            margin-bottom: 15px;
            padding-left: 15px;
            border-left: 2px solid #E5E7EB;
        }

        .personal-project-name {
            font-size: 14px;
            font-weight: 600;
        }

        .personal-project-desc {
            font-size: 13px;
            color: #374151;
            margin: 5px 0;
        }

        /* Volunteer */
        .volunteer-item {
            margin-bottom: 15px;
        }

        .volunteer-org {
            font-size: 14px;
            font-weight: 600;
        }

        .volunteer-role {
            font-size: 13px;
            color: #4B5563;
        }

        .volunteer-dates {
            font-size: 12px;
            color: #6B7280;
        }

        /* Awards */
        .award-item {
            margin-bottom: 12px;
        }

        .award-title {
            font-size: 14px;
            font-weight: 600;
        }

        .award-issuer {
            font-size: 12px;
            color: #6B7280;
        }

        /* Publications */
        .publication-item {
            margin-bottom: 12px;
        }

        .publication-title {
            font-size: 14px;
            font-weight: 600;
        }

        .publication-details {
            font-size: 12px;
            color: #6B7280;
        }

        /* Interests */
        .interests-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .interest-badge {
            background: #F3F4F6;
            border: 1px solid #D1D5DB;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 3px;
        }

        /* References */
        .reference-item {
            margin-bottom: 15px;
        }

        .reference-name {
            font-size: 14px;
            font-weight: 600;
        }

        .reference-details {
            font-size: 12px;
            color: #6B7280;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .contact {
                flex-direction: column;
                gap: 8px;
            }

            .experience-header {
                flex-direction: column;
            }
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: #6B7280;
        }
    </style>
</head>
<body>

    <div id="loading">Loading resume data...</div>

    <div id="resume-content" style="display: none;">
        <!-- Content will be generated here -->
    </div>

    <script src="../resume-utils.js"></script>
    <script>
        async function loadResume() {
            try {
                const response = await fetch('../resume-data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading resume data. Make sure resume-data.json exists.';
            }
        }

        function renderResume(data) {
            const { personal, education, skills, experience, achievements, certifications, languages, projects, volunteer, awards, publications, courses, speaking, patents, interests, references } = data;

            document.getElementById('page-title').textContent = `${personal.name} - Resume`;

            let html = `
                <header>
                    <h1>${personal.name}</h1>
                    <div class="title">${personal.title}</div>
                    <div class="contact">
                        <div class="contact-item">${personal.email}</div>
                        ${personal.phone ? `<div class="contact-item">${personal.phone}</div>` : ''}
                        <div class="contact-item">${personal.location}</div>
                        ${personal.linkedin ? `<div class="contact-item">${ResumeUtils.formatURL(personal.linkedin)}</div>` : ''}
                        ${personal.github ? `<div class="contact-item">${ResumeUtils.formatURL(personal.github)}</div>` : ''}
                        ${personal.website ? `<div class="contact-item">${ResumeUtils.formatURL(personal.website)}</div>` : ''}
                    </div>
                </header>

                <section>
                    <h2>Professional Summary</h2>
                    <div class="summary">${personal.summary}</div>
                </section>

                <section>
                    <h2>Education</h2>
                    ${education.map(edu => `
                        <div class="education-item">
                            <h3>${edu.degree}</h3>
                            <div class="institution">${edu.institution}</div>
                            <div class="details">${edu.location} | CGPA: ${edu.cgpa} | ${edu.year}</div>
                            ${edu.honors ? `<div class="details" style="font-style: italic;">${edu.honors}</div>` : ''}
                        </div>
                    `).join('')}
                </section>

                <section>
                    <h2>Technical Skills</h2>
                    <div class="skills-grid">
                        ${Object.entries(skills).map(([category, skillList]) => `
                            <div class="skill-category">
                                <h3>${category}</h3>
                                <div class="skill-list">
                                    ${skillList.map(skill => `<span class="skill-badge">${skill}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <section>
                    <h2>Professional Experience</h2>
                    ${experience.map(exp => `
                        <div class="experience-item">
                            <div class="experience-header">
                                <div class="company-name">${exp.company}</div>
                                <div class="date-range">${exp.startDate} - ${exp.endDate}</div>
                            </div>
                            <div class="position">${exp.position}</div>
                            <div class="location">${exp.location}${exp.website ? ' | ' + exp.website : ''}</div>

                            ${exp.projects.map(project => `
                                <div class="project">
                                    <div class="project-name">${project.name}</div>
                                    <div class="project-role">${project.role}</div>
                                    <div class="project-desc">${project.description}</div>
                                    ${project.achievements ? `
                                        <ul>
                                            ${project.achievements.map(achievement => `<li>${achievement}</li>`).join('')}
                                        </ul>
                                    ` : ''}
                                    ${project.subProjects ? project.subProjects.map(sub => `
                                        <div style="margin-top: 8px;">
                                            <strong style="font-size: 12px;">${sub.name}</strong>
                                            <ul>
                                                ${sub.details.map(detail => `<li>${detail}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `).join('') : ''}
                                    <div class="tech-stack">
                                        ${project.techStack.map(tech => `<span class="tech-badge">${tech}</span>`).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </section>

                ${ResumeUtils.hasData(achievements) ? `
                <section>
                    <h2>Key Achievements</h2>
                    <div class="achievements-grid">
                        ${achievements.map(achievement => `
                            <div class="achievement-item">
                                <span class="achievement-title">${achievement.title}:</span> ${achievement.description}
                            </div>
                        `).join('')}
                    </div>
                </section>
                ` : ''}

                ${ResumeUtils.hasData(certifications) ? `
                <section>
                    <h2>Certifications</h2>
                    ${certifications.map(cert => `
                        <div class="cert-item">
                            <div class="cert-name">${cert.name}</div>
                            <div class="cert-issuer">${cert.issuer} | ${cert.date}${cert.expiryDate ? ' - ' + cert.expiryDate : ''}${cert.credentialId ? ' | ID: ' + cert.credentialId : ''}</div>
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                ${ResumeUtils.hasData(projects) ? `
                <section>
                    <h2>Personal Projects</h2>
                    ${projects.map(project => `
                        <div class="personal-project">
                            <div class="personal-project-name">${project.name}${project.url ? ` <a href="${project.url}" style="font-size: 12px; color: #6B7280;">${ResumeUtils.formatURL(project.url)}</a>` : ''}</div>
                            <div class="personal-project-desc">${project.description}</div>
                            ${project.highlights ? `
                                <ul>
                                    ${project.highlights.map(h => `<li>${h}</li>`).join('')}
                                </ul>
                            ` : ''}
                            ${project.techStack ? `
                                <div class="tech-stack">
                                    ${project.techStack.map(tech => `<span class="tech-badge">${tech}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                ${ResumeUtils.hasData(volunteer) ? `
                <section>
                    <h2>Volunteer Experience</h2>
                    ${volunteer.map(vol => `
                        <div class="volunteer-item">
                            <div class="volunteer-org">${vol.organization}</div>
                            <div class="volunteer-role">${vol.role}</div>
                            <div class="volunteer-dates">${vol.startDate} - ${vol.endDate || 'Present'}</div>
                            ${vol.description ? `<div class="project-desc">${vol.description}</div>` : ''}
                            ${vol.highlights ? `
                                <ul>
                                    ${vol.highlights.map(h => `<li>${h}</li>`).join('')}
                                </ul>
                            ` : ''}
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                ${ResumeUtils.hasData(awards) ? `
                <section>
                    <h2>Awards & Honors</h2>
                    ${awards.map(award => `
                        <div class="award-item">
                            <div class="award-title">${award.title}</div>
                            <div class="award-issuer">${award.issuer} | ${award.date}</div>
                            ${award.description ? `<div class="project-desc">${award.description}</div>` : ''}
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                ${ResumeUtils.hasData(publications) ? `
                <section>
                    <h2>Publications</h2>
                    ${publications.map(pub => `
                        <div class="publication-item">
                            <div class="publication-title">${pub.title}</div>
                            <div class="publication-details">${pub.publisher} | ${pub.date}${pub.url ? ` | <a href="${pub.url}" style="color: #6B7280;">${ResumeUtils.formatURL(pub.url)}</a>` : ''}</div>
                            ${pub.description ? `<div class="project-desc">${pub.description}</div>` : ''}
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                ${ResumeUtils.hasData(courses) ? `
                <section>
                    <h2>Courses & Training</h2>
                    ${courses.map(course => `
                        <div class="cert-item">
                            <div class="cert-name">${course.name}</div>
                            <div class="cert-issuer">${course.provider} | ${course.date}</div>
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                ${ResumeUtils.hasData(speaking) ? `
                <section>
                    <h2>Speaking Engagements</h2>
                    ${speaking.map(talk => `
                        <div class="publication-item">
                            <div class="publication-title">${talk.title}</div>
                            <div class="publication-details">${talk.event} | ${talk.location} | ${talk.date}</div>
                            ${talk.description ? `<div class="project-desc">${talk.description}</div>` : ''}
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                ${ResumeUtils.hasData(patents) ? `
                <section>
                    <h2>Patents</h2>
                    ${patents.map(patent => `
                        <div class="publication-item">
                            <div class="publication-title">${patent.title}</div>
                            <div class="publication-details">${patent.patentNumber} | ${patent.status} | ${patent.date}</div>
                            ${patent.description ? `<div class="project-desc">${patent.description}</div>` : ''}
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                ${ResumeUtils.hasData(languages) ? `
                <section>
                    <h2>Languages</h2>
                    <div class="languages-grid">
                        ${languages.map(lang => `
                            <div class="language-item">
                                <span class="language-name">${lang.language}</span>
                                <span class="language-level"> - ${lang.proficiency}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>
                ` : ''}

                ${ResumeUtils.hasData(interests) ? `
                <section>
                    <h2>Interests</h2>
                    <div class="interests-list">
                        ${interests.map(interest => `<span class="interest-badge">${interest}</span>`).join('')}
                    </div>
                </section>
                ` : ''}

                ${ResumeUtils.hasData(references) && references[0].name !== 'Available upon request' ? `
                <section>
                    <h2>References</h2>
                    ${references.map(ref => `
                        <div class="reference-item">
                            <div class="reference-name">${ref.name}</div>
                            <div class="reference-details">${ref.title}${ref.company ? ' at ' + ref.company : ''}</div>
                            ${ref.email ? `<div class="reference-details">${ref.email}${ref.phone ? ' | ' + ref.phone : ''}</div>` : ''}
                        </div>
                    `).join('')}
                </section>
                ` : ResumeUtils.hasData(references) ? `
                <section>
                    <h2>References</h2>
                    <div class="project-desc">Available upon request</div>
                </section>
                ` : ''}
            `;

            document.getElementById('resume-content').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resume-content').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', loadResume);
    </script>

</body>
</html>
