<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Resume - Compact One-Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            font-size: 10px;
            line-height: 1.4;
            color: #1F2937;
            background: #fff;
            max-width: 850px;
            margin: 0 auto;
            padding: 30px 40px;
        }

        @media print {
            body {
                padding: 20px 30px;
            }
        }

        header {
            border-bottom: 3px solid #059669;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 3px;
            color: #047857;
        }

        .title {
            font-size: 11px;
            color: #059669;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .contact {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 9px;
            color: #4B5563;
        }

        .contact-item::after {
            content: "|";
            margin-left: 10px;
            color: #D1D5DB;
        }

        .contact-item:last-child::after {
            content: "";
        }

        section {
            margin-bottom: 12px;
        }

        h2 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #047857;
            border-bottom: 2px solid #059669;
            padding-bottom: 3px;
            margin-bottom: 8px;
        }

        .summary {
            font-size: 10px;
            line-height: 1.5;
            color: #374151;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .skill-category {
            margin-bottom: 6px;
        }

        .skill-category h3 {
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 3px;
            color: #059669;
        }

        .skill-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .skill-badge {
            background: #D1FAE5;
            color: #065F46;
            padding: 1px 5px;
            font-size: 8px;
            border-radius: 2px;
            font-weight: 500;
        }

        .education-item h3 {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .education-item .institution {
            font-size: 10px;
            font-weight: 500;
            color: #059669;
            margin-bottom: 2px;
        }

        .education-item .details {
            font-size: 9px;
            color: #6B7280;
        }

        .experience-item {
            margin-bottom: 10px;
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 3px;
        }

        .company-name {
            font-size: 12px;
            font-weight: 700;
            color: #047857;
        }

        .date-range {
            font-size: 9px;
            color: #6B7280;
        }

        .position {
            font-size: 10px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 2px;
        }

        .location {
            font-size: 9px;
            color: #6B7280;
            margin-bottom: 5px;
        }

        .project {
            margin-bottom: 8px;
            padding-left: 10px;
        }

        .project-name {
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .project-role {
            font-size: 9px;
            font-style: italic;
            color: #6B7280;
            margin-bottom: 3px;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            font-size: 9px;
            margin-bottom: 2px;
            padding-left: 10px;
            position: relative;
            color: #4B5563;
        }

        li:before {
            content: "•";
            position: absolute;
            left: 0;
            font-weight: bold;
            color: #059669;
        }

        .tech-stack {
            font-size: 8px;
            color: #6B7280;
            margin-top: 2px;
        }

        .achievements-compact {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .achievement-item {
            font-size: 9px;
            padding-left: 12px;
            position: relative;
        }

        .achievement-item:before {
            content: "✓";
            position: absolute;
            left: 0;
            font-weight: bold;
            color: #059669;
            font-size: 10px;
        }

        .achievement-title {
            font-weight: 600;
        }

        .compact-section {
            font-size: 9px;
            color: #4B5563;
        }

        .compact-item {
            margin-bottom: 4px;
        }

        .compact-item-title {
            font-weight: 600;
            color: #374151;
        }

        .compact-item-details {
            color: #6B7280;
            font-size: 8px;
        }

        .languages-inline {
            font-size: 9px;
            color: #4B5563;
        }

        .interests-inline {
            font-size: 9px;
            color: #4B5563;
        }

        @media (max-width: 768px) {
            .two-column,
            .achievements-compact {
                grid-template-columns: 1fr;
            }
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: #6B7280;
        }

        .project ul {
            max-height: none;
        }

        .project li {
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="loading">Loading resume data...</div>

    <div id="resume-content" style="display: none;"></div>

    <script src="../resume-utils.js"></script>
    <script>
        async function loadResume() {
            try {
                const response = await fetch('../resume-data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading resume data.';
            }
        }

        function renderResume(data) {
            const { personal, education, skills, experience, achievements, certifications, languages, projects, volunteer, awards, publications, courses, speaking, patents, interests, references } = data;

            document.getElementById('page-title').textContent = `${personal.name} - Resume`;

            const topAchievements = achievements ? achievements.slice(0, 6) : [];

            let html = `
                <header>
                    <h1>${personal.name}</h1>
                    <div class="title">${personal.title}</div>
                    <div class="contact">
                        <span class="contact-item">${personal.email}</span>
                        ${personal.phone ? `<span class="contact-item">${personal.phone}</span>` : ''}
                        <span class="contact-item">${personal.location}</span>
                        ${personal.linkedin ? `<span class="contact-item">${ResumeUtils.formatURL(personal.linkedin)}</span>` : ''}
                        ${personal.github ? `<span class="contact-item">${ResumeUtils.formatURL(personal.github)}</span>` : ''}
                    </div>
                </header>

                <section>
                    <h2>Professional Summary</h2>
                    <div class="summary">${personal.summary.replace(/<strong>/g, '').replace(/<\/strong>/g, '')}</div>
                </section>

                <div class="two-column">
                    <section>
                        <h2>Skills</h2>
                        ${Object.entries(skills).slice(0, 4).map(([category, skillList]) => `
                            <div class="skill-category">
                                <h3>${category}</h3>
                                <div class="skill-badges">
                                    ${skillList.map(skill => `<span class="skill-badge">${skill}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </section>

                    <section>
                        <h2>Education</h2>
                        ${education.map(edu => `
                            <div class="education-item">
                                <h3>${edu.degree}</h3>
                                <div class="institution">${edu.institution}</div>
                                <div class="details">${edu.location}</div>
                                <div class="details">CGPA: ${edu.cgpa} | ${edu.year}</div>
                            </div>
                        `).join('')}

                        ${topAchievements.length ? `
                            <h2 style="margin-top: 10px;">Key Highlights</h2>
                            <div class="achievements-compact">
                                ${topAchievements.map(achievement => `
                                    <div class="achievement-item">
                                        <span class="achievement-title">${achievement.title}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}

                        ${ResumeUtils.hasData(certifications) ? `
                            <h2 style="margin-top: 10px;">Certifications</h2>
                            <div class="compact-section">
                                ${certifications.slice(0, 3).map(cert => `
                                    <div class="compact-item">
                                        <span class="compact-item-title">${cert.name}</span>
                                        <span class="compact-item-details"> - ${cert.issuer}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </section>
                </div>

                <section>
                    <h2>Professional Experience</h2>
                    ${experience.map(exp => `
                        <div class="experience-item">
                            <div class="exp-header">
                                <span class="company-name">${exp.company}</span>
                                <span class="date-range">${exp.startDate} - ${exp.endDate}</span>
                            </div>
                            <div class="position">${exp.position}</div>
                            <div class="location">${exp.location}</div>

                            ${exp.projects.slice(0, 2).map(project => `
                                <div class="project">
                                    <div class="project-name">${project.name}</div>
                                    <div class="project-role">${project.role}</div>

                                    ${project.achievements ? `
                                        <ul>
                                            ${project.achievements.slice(0, 3).map(achievement => `<li>${achievement}</li>`).join('')}
                                        </ul>
                                    ` : ''}

                                    ${project.subProjects ? `
                                        <ul>
                                            ${project.subProjects.slice(0, 2).map(sub =>
                                                `<li><strong>${sub.name}:</strong> ${sub.details[0]}</li>`
                                            ).join('')}
                                        </ul>
                                    ` : ''}

                                    <div class="tech-stack">Tech: ${project.techStack.join(', ')}</div>
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </section>

                ${Object.entries(skills).length > 4 ? `
                    <section>
                        <h2>Additional Skills</h2>
                        <div class="two-column">
                            ${Object.entries(skills).slice(4).map(([category, skillList]) => `
                                <div class="skill-category">
                                    <h3>${category}</h3>
                                    <div class="skill-badges">
                                        ${skillList.map(skill => `<span class="skill-badge">${skill}</span>`).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(languages) || ResumeUtils.hasData(interests) ? `
                    <section>
                        <div class="two-column">
                            ${ResumeUtils.hasData(languages) ? `
                                <div>
                                    <h2>Languages</h2>
                                    <div class="languages-inline">
                                        ${languages.map(lang => `${lang.language} (${lang.proficiency})`).join(' • ')}
                                    </div>
                                </div>
                            ` : ''}
                            ${ResumeUtils.hasData(interests) ? `
                                <div>
                                    <h2>Interests</h2>
                                    <div class="interests-inline">${interests.join(' • ')}</div>
                                </div>
                            ` : ''}
                        </div>
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(projects) ? `
                    <section>
                        <h2>Personal Projects</h2>
                        <div class="two-column">
                            ${projects.slice(0, 2).map(project => `
                                <div class="compact-item">
                                    <span class="compact-item-title">${project.name}</span>
                                    <div class="compact-item-details">${project.description}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(awards) ? `
                    <section>
                        <h2>Awards</h2>
                        <div class="compact-section">
                            ${awards.slice(0, 3).map(award => `
                                <div class="compact-item">
                                    <span class="compact-item-title">${award.title}</span>
                                    <span class="compact-item-details"> - ${award.issuer}, ${award.date}</span>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}

                ${ResumeUtils.hasData(volunteer) ? `
                    <section>
                        <h2>Volunteer</h2>
                        <div class="compact-section">
                            ${volunteer.slice(0, 2).map(vol => `
                                <div class="compact-item">
                                    <span class="compact-item-title">${vol.organization}</span>
                                    <span class="compact-item-details"> - ${vol.role}</span>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                ` : ''}
            `;

            document.getElementById('resume-content').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resume-content').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', loadResume);
    </script>

</body>
</html>
