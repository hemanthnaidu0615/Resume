<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            .no-print {
                display: none;
            }
            .page-break {
                page-break-before: always;
            }
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .skill-badge {
            transition: all 0.3s ease;
        }

        .skill-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .timeline-item {
            position: relative;
            padding-left: 2rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.5rem;
            width: 0.75rem;
            height: 0.75rem;
            background: #667eea;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #667eea;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: 0.34rem;
            top: 1.25rem;
            width: 2px;
            height: calc(100% - 0.5rem);
            background: linear-gradient(180deg, #667eea 0%, #e5e7eb 100%);
        }

        .timeline-item:last-child::after {
            display: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .section-title {
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Loading State -->
    <div id="loading" class="text-center">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        <p class="mt-4 text-gray-600">Loading Resume...</p>
    </div>

    <!-- Main Content (Hidden until loaded) -->
    <div id="resume-content" style="display: none;">

        <!-- Header Section -->
        <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-12 print:py-6">
            <div class="container mx-auto px-6 max-w-6xl">
                <h1 id="header-name" class="text-5xl font-bold mb-2 print:text-4xl"></h1>
                <p id="header-title" class="text-2xl mb-4 text-indigo-100 print:text-xl"></p>
                <div id="header-contact" class="flex flex-wrap gap-4 text-sm print:text-xs"></div>
            </div>
        </header>

        <div class="container mx-auto px-6 py-8 max-w-6xl">

            <!-- Summary Section -->
            <section class="mb-10 bg-white rounded-lg shadow-md p-6 print:shadow-none">
                <h2 class="text-3xl font-bold mb-4 gradient-text section-title">Professional Summary</h2>
                <p id="summary-text" class="text-gray-700 leading-relaxed text-lg"></p>
            </section>

            <!-- Education Section -->
            <section class="mb-10 bg-white rounded-lg shadow-md p-6 print:shadow-none">
                <h2 class="text-3xl font-bold mb-6 gradient-text section-title">Education</h2>
                <div id="education-list"></div>
            </section>

            <!-- Technical Skills Section -->
            <section class="mb-10 bg-white rounded-lg shadow-md p-6 print:shadow-none">
                <h2 class="text-3xl font-bold mb-6 gradient-text section-title">Technical Skills</h2>
                <div id="skills-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </section>

            <!-- Professional Experience Section -->
            <section class="mb-10 bg-white rounded-lg shadow-md p-6 print:shadow-none page-break">
                <h2 class="text-3xl font-bold mb-6 gradient-text section-title">Professional Experience</h2>
                <div id="experience-list"></div>
            </section>

            <!-- Key Achievements -->
            <section class="mb-10 bg-white rounded-lg shadow-md p-6 print:shadow-none">
                <h2 class="text-3xl font-bold mb-6 gradient-text section-title">Key Achievements</h2>
                <div id="achievements-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>

            <!-- Projects Portfolio -->
            <section class="mb-10 bg-white rounded-lg shadow-md p-6 print:shadow-none">
                <h2 class="text-3xl font-bold mb-6 gradient-text section-title">Notable Projects</h2>
                <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </section>

        </div>

        <!-- Footer -->
        <footer class="bg-gray-800 text-white py-6 mt-12 print:hidden">
            <div class="container mx-auto px-6 max-w-6xl text-center">
                <p class="text-sm">Last Updated: <span id="last-updated"></span></p>
                <p class="text-xs text-gray-400 mt-2">This resume is built with modular JSON data</p>
                <a href="admin.html" class="text-indigo-400 hover:text-indigo-300 text-sm mt-2 inline-block">Edit Resume Data</a>
            </div>
        </footer>

    </div>

    <script>
        // Load and render resume data
        async function loadResumeData() {
            try {
                const response = await fetch('resume-data.json');
                const data = await response.json();
                renderResume(data);
            } catch (error) {
                console.error('Error loading resume data:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="text-center text-red-600">
                        <p class="text-xl font-bold">Error Loading Resume</p>
                        <p class="mt-2">Please make sure resume-data.json exists and is valid.</p>
                    </div>
                `;
            }
        }

        function renderResume(data) {
            // Set page title
            document.getElementById('page-title').textContent = `${data.personal.name} - Resume`;

            // Render header
            document.getElementById('header-name').textContent = data.personal.name;
            document.getElementById('header-title').textContent = data.personal.title;

            const contactHTML = `
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg>
                    <span>${data.personal.location}</span>
                </div>
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
                    <span>${data.personal.email}</span>
                </div>
            `;
            document.getElementById('header-contact').innerHTML = contactHTML;

            // Render summary
            document.getElementById('summary-text').innerHTML = data.personal.summary;

            // Render education
            const educationHTML = data.education.map(edu => `
                <div class="border-l-4 border-indigo-600 pl-6">
                    <h3 class="text-xl font-bold text-gray-900">${edu.degree}</h3>
                    <p class="text-indigo-600 font-semibold">${edu.institution}</p>
                    <p class="text-gray-600">${edu.location}</p>
                    <div class="mt-2 flex items-center gap-4">
                        <span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-semibold">CGPA: ${edu.cgpa}</span>
                        <span class="text-gray-600">Graduated: ${edu.year}</span>
                    </div>
                </div>
            `).join('');
            document.getElementById('education-list').innerHTML = educationHTML;

            // Render skills
            const skillColors = {
                'Frontend Development': 'blue',
                'Backend Development': 'purple',
                'Databases': 'green',
                'DevOps & Cloud': 'orange',
                'Testing & Tools': 'pink',
                'AI & Emerging Tech': 'red'
            };

            const skillsHTML = Object.entries(data.skills).map(([category, skills]) => {
                const color = skillColors[category] || 'gray';
                return `
                    <div>
                        <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span class="w-2 h-2 bg-${color}-600 rounded-full"></span>
                            ${category}
                        </h3>
                        <div class="flex flex-wrap gap-2">
                            ${skills.map(skill => `
                                <span class="skill-badge bg-${color}-100 text-${color}-800 px-3 py-1 rounded-lg text-sm font-medium">${skill}</span>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('skills-grid').innerHTML = skillsHTML;

            // Render experience
            const experienceHTML = data.experience.map(exp => {
                const projectsHTML = exp.projects.map(project => {
                    let projectContent = `
                        <div class="ml-4 mb-6 border-l-2 border-indigo-200 pl-4">
                            <h4 class="text-xl font-bold text-gray-800 mb-2">${project.name}</h4>
                            <p class="text-sm text-indigo-600 font-semibold mb-2">Role: ${project.role}</p>
                            <p class="text-gray-700 mb-3">${project.description}</p>
                    `;

                    // Handle sub-projects if they exist
                    if (project.subProjects) {
                        const subProjectsHTML = project.subProjects.map(sub => `
                            <div class="mb-4">
                                <p class="font-semibold text-gray-800">${sub.name}</p>
                                <ul class="list-disc list-inside text-gray-700 ml-4 space-y-1">
                                    ${sub.details.map(detail => `<li>${detail}</li>`).join('')}
                                </ul>
                            </div>
                        `).join('');
                        projectContent += subProjectsHTML;
                    } else if (project.achievements) {
                        projectContent += `
                            <ul class="list-disc list-inside text-gray-700 mb-3 space-y-1">
                                ${project.achievements.map(achievement => `<li>${achievement}</li>`).join('')}
                            </ul>
                        `;
                    }

                    projectContent += `
                            <div class="flex flex-wrap gap-2">
                                ${project.techStack.map(tech => `
                                    <span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs">${tech}</span>
                                `).join('')}
                            </div>
                        </div>
                    `;

                    return projectContent;
                }).join('');

                return `
                    <div class="timeline-item mb-8">
                        <div class="mb-6">
                            <div class="flex justify-between items-start flex-wrap gap-2 mb-2">
                                <div>
                                    <h3 class="text-2xl font-bold text-gray-900">${exp.company}</h3>
                                    <p class="text-indigo-600 font-semibold">${exp.position}</p>
                                </div>
                                <span class="bg-indigo-600 text-white px-4 py-1 rounded-full text-sm font-semibold whitespace-nowrap">
                                    ${exp.startDate} - ${exp.endDate}
                                </span>
                            </div>
                            <p class="text-gray-600 mb-4">${exp.location}${exp.website ? ' | ' + exp.website : ''}${exp.duration ? ' (' + exp.duration + ')' : ''}</p>
                            ${projectsHTML}
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('experience-list').innerHTML = experienceHTML;

            // Render achievements
            const achievementsHTML = data.achievements.map(achievement => `
                <div class="flex items-start gap-3">
                    <svg class="w-6 h-6 text-indigo-600 flex-shrink-0 mt-1" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    <p class="text-gray-700"><strong>${achievement.title}:</strong> ${achievement.description}</p>
                </div>
            `).join('');
            document.getElementById('achievements-grid').innerHTML = achievementsHTML;

            // Render notable projects
            const projectsHTML = data.notableProjects.map(project => `
                <div class="border border-gray-200 rounded-lg p-4 hover:shadow-lg transition-shadow">
                    <h3 class="text-lg font-bold text-gray-900 mb-2">${project.name}</h3>
                    <p class="text-sm text-gray-600 mb-2">${project.description}</p>
                    <p class="text-xs text-indigo-600 font-semibold">${project.highlight}</p>
                </div>
            `).join('');
            document.getElementById('projects-grid').innerHTML = projectsHTML;

            // Set last updated date
            document.getElementById('last-updated').textContent = new Date().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long'
            });

            // Hide loading, show content
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resume-content').style.display = 'block';
        }

        // Print functionality
        document.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key === 'p') {
                event.preventDefault();
                window.print();
            }
        });

        // Load resume on page load
        window.addEventListener('DOMContentLoaded', loadResumeData);
    </script>

</body>
</html>
